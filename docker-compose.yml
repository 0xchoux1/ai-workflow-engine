services:
  # ========================================
  # n8n - ワークフロー自動化プラットフォーム
  # ========================================
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-true}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-changeme}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=${TIMEZONE:-Asia/Tokyo}
      - TZ=${TIMEZONE:-Asia/Tokyo}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./upload:/tmp/upload
    networks:
      - workflow-network

  # ========================================
  # Dify - LLMOpsプラットフォーム
  # ========================================
  
  # Dify API サービス
  dify-api:
    image: langgenius/dify-api:latest
    container_name: dify-api
    restart: unless-stopped
    environment:
      # モード設定
      - MODE=api
      
      # データベース設定
      - DB_USERNAME=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-difyai123456}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${POSTGRES_DB:-dify}
      
      # Redis設定
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-difyai123456}
      - REDIS_USE_SSL=false
      - REDIS_DB=0
      
      # Celery設定
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-difyai123456}@redis:6379/1
      
      # ストレージ設定
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=storage
      
      # ベクトルデータベース（Weaviate）
      - VECTOR_STORE=weaviate
      - WEAVIATE_HOST=weaviate
      - WEAVIATE_PORT=8080
      - WEAVIATE_GRPC_PORT=50051
      
      # その他
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SECRET_KEY=${DIFY_SECRET_KEY:-sk-9f73s3ljTXVcMT3Blb3ljTqtsKiGHXVcMT3BlbkFJLK7U}
      - CONSOLE_WEB_URL=${DIFY_CONSOLE_URL:-http://localhost:3000}
      - CONSOLE_API_URL=${DIFY_API_URL:-http://localhost:5001}
      - SERVICE_API_URL=${DIFY_API_URL:-http://localhost:5001}
      
    depends_on:
      - postgres
      - redis
      - weaviate
    volumes:
      - dify_app_storage:/app/api/storage
    networks:
      - workflow-network

  # Dify Worker (Celeryワーカー)
  dify-worker:
    image: langgenius/dify-api:latest
    container_name: dify-worker
    restart: unless-stopped
    environment:
      - MODE=worker
      - DB_USERNAME=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-difyai123456}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${POSTGRES_DB:-dify}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-difyai123456}
      - REDIS_DB=0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-difyai123456}@redis:6379/1
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=storage
      - VECTOR_STORE=weaviate
      - WEAVIATE_HOST=weaviate
      - WEAVIATE_PORT=8080
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SECRET_KEY=${DIFY_SECRET_KEY:-sk-9f73s3ljTXVcMT3Blb3ljTqtsKiGHXVcMT3BlbkFJLK7U}
    depends_on:
      - postgres
      - redis
      - weaviate
    volumes:
      - dify_app_storage:/app/api/storage
    networks:
      - workflow-network

  # Dify Web (フロントエンド)
  dify-web:
    image: langgenius/dify-web:latest
    container_name: dify-web
    restart: unless-stopped
    environment:
      - CONSOLE_API_URL=${DIFY_API_URL:-http://localhost:5001}
      - APP_API_URL=${DIFY_API_URL:-http://localhost:5001}
    ports:
      - "3000:3000"
    depends_on:
      - dify-api
    networks:
      - workflow-network

  # Nginx (リバースプロキシ)
  dify-nginx:
    image: nginx:alpine
    container_name: dify-nginx
    restart: unless-stopped
    ports:
      - "5001:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - dify-api
      - dify-web
    networks:
      - workflow-network

  # ========================================
  # データベース & キャッシュ
  # ========================================
  
  # PostgreSQL (Dify用)
  postgres:
    image: postgres:15-alpine
    container_name: dify-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-difyai123456}
      - POSTGRES_DB=${POSTGRES_DB:-dify}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - workflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (Dify用キャッシュ & n8n用キュー)
  redis:
    image: redis:7-alpine
    container_name: workflow-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-difyai123456}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - workflow-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Weaviate (Dify用ベクトルデータベース)
  weaviate:
    image: semitechnologies/weaviate:1.24.4
    container_name: dify-weaviate
    restart: unless-stopped
    environment:
      - QUERY_DEFAULTS_LIMIT=25
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - DEFAULT_VECTORIZER_MODULE=none
      - CLUSTER_HOSTNAME=node1
      - AUTHENTICATION_APIKEY_ENABLED=true
      - AUTHENTICATION_APIKEY_ALLOWED_KEYS=${WEAVIATE_API_KEY:-WVF5YThaHlkYwhGUSmCRgsX3tD5ngdN8pkih}
      - AUTHENTICATION_APIKEY_USERS=hello@dify.ai
      - AUTHORIZATION_ADMINLIST_ENABLED=true
      - AUTHORIZATION_ADMINLIST_USERS=hello@dify.ai
    volumes:
      - weaviate_data:/var/lib/weaviate
    ports:
      - "8080:8080"
      - "50051:50051"
    networks:
      - workflow-network

volumes:
  n8n_data:
    name: n8n_data
  dify_app_storage:
    name: dify_app_storage
  postgres_data:
    name: dify_postgres_data
  redis_data:
    name: workflow_redis_data
  weaviate_data:
    name: dify_weaviate_data

networks:
  workflow-network:
    name: workflow-network
    driver: bridge
