[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=.
    --cov-report=term-missing
    --cov-report=html
markers =
    api: API level tests
    e2e: End-to-end tests
    integration: Integration tests
    smoke: Smoke tests for quick validation
    slow: Tests that take longer to run
asyncio_mode = auto
